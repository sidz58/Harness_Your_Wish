<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Agent form test</title>
<style>
body { font: 18px system-ui; max-width: 640px; margin: 60px auto; padding: 24px; background: #f5f7fb; color: #172238; }
label { display: block; margin-top: 24px; }
input, button { font: inherit; padding: 12px; margin-top: 8px; }
input { display: block; width: 90%; }
button { background: #214eb5; color: white; border: 0; border-radius: 6px; margin-top: 24px; }
#confirmation { margin-top: 32px; }
</style>
<h1>Agent form test</h1>
<p>Local demonstration. No information is sent to a server.</p>
<form id="registration">
  <label for="name">Full name</label><input id="name" name="name" required>
  <label for="email">Email</label><input id="email" name="email" type="email" required>
  <button type="submit">Submit registration</button>
</form>
<p id="confirmation" role="status" hidden></p>
<script>
document.querySelector('form').addEventListener('submit', event => {
  event.preventDefault();
  const confirmation = document.querySelector('#confirmation');
  confirmation.textContent = `Registration confirmed for ${document.querySelector('#name').value} (${document.querySelector('#email').value}).`;
  confirmation.hidden = false;
});
</script>
</html>
